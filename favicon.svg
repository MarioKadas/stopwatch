<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Stopwatch</title>
  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0F172A"/>
  <!-- top crown button -->
  <rect x="27" y="6" width="10" height="5" rx="2" fill="#F8FAFC"/>
  <rect x="30" y="10" width="4" height="7" fill="#F8FAFC"/>
  <!-- side button -->
  <rect x="43" y="15" width="9" height="5" rx="2" transform="rotate(45 47.5 17.5)" fill="#38BDF8"/>
  <!-- face ring -->
  <circle cx="32" cy="37" r="18" fill="none" stroke="#F8FAFC" stroke-width="5"/>
  <!-- elapsed wedge -->
  <path d="M32 37 L32 25 A12 12 0 0 1 44 37 Z" fill="#38BDF8" opacity="0.35"/>
  <!-- hand -->
  <line x1="32" y1="37" x2="32" y2="25" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <!-- center pin -->
  <circle cx="32" cy="37" r="3" fill="#F8FAFC"/>
</svg>
